<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PushInn contact confirmation for submitted support, sponsor, and beta access requests." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pushinn.app/thank-you.html" />
  <meta property="og:title" content="PushInn | Thank You" />
  <meta property="og:description" content="Your intel has been received. PushInn core will process your request and respond shortly." />
  <meta property="og:image" content="https://pushinn.app/og-image.png" />
  <meta property="og:site_name" content="PushInn" />
  <title>Thank You – PushInn</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #00FF41;
      --dark-green: #39D353;
      --black:      #000000;
      --surface:    #0A0A0A;
      --text:       #E0E0E0;
      --border:     rgba(0, 255, 65, 0.15);
      --font:       'Inter', sans-serif;
      --font-display:'Outfit', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--black);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.96);
      backdrop-filter: blur(15px);
    }

    .nav-inner {
      width: min(820px, 100%);
      margin-inline: auto;
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 1rem;
    }

    .nav-logo {
      font-family: monospace;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--green);
      text-decoration: none;
    }

    .nav-back {
      font-family: monospace;
      color: var(--dark-green);
      letter-spacing: .18em;
      font-size: .65rem;
      position: absolute;
      right: 0;
    }

    .nav-links {
      font-family: monospace;
      color: var(--dark-green);
      letter-spacing: .18em;
      font-size: .65rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      list-style: none;
      justify-content: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .success-icon {
      width: 64px; height: 64px;
      border: 2px solid var(--green);
      display: grid; place-items: center;
      color: var(--green);
      margin-bottom: 2rem;
      font-family: monospace;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 0 20px rgba(0,255,65,0.3);
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #fff;
      margin-bottom: 1rem;
    }

    p {
      font-family: monospace;
      font-size: .85rem;
      color: var(--dark-green);
      margin-bottom: 3rem;
    }

    .btn-return {
      font-family: monospace;
      font-size: .75rem;
      color: var(--green);
      text-decoration: none;
      border: 1px solid var(--green);
      padding: .8rem 2rem;
      letter-spacing: .1em;
      transition: background .3s;
    }

    .btn-return:hover {
      background: var(--green);
      color: var(--black);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      font-family: monospace;
      font-size: .65rem;
      color: var(--dark-green);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .75rem 1.25rem;
    }

    .footer-links a,
    .nav-links a,
    .nav-back { color: var(--dark-green); }

    .footer-links a:hover,
    .nav-links a:hover,
    .nav-back:hover {
      color: var(--green);
    }

    @media (max-width: 600px) {
      .nav-top {
        flex-direction: column;
      }
      .nav-back { position: static; }
    }

    /* ── Navbar Consistency Override ── */
    nav::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--green), #fff, var(--green), transparent);
      box-shadow: 0 0 15px 1px var(--green), 0 0 30px 2px rgba(0,255,65,0.35);
      opacity: 0.8;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--green);
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .nav-back {
      font-family: monospace;
      font-size: .65rem;
      color: var(--dark-green);
      letter-spacing: .18em;
    }
    .nav-links {
      font-family: monospace;
      font-size: .65rem;
      letter-spacing: .22em;
      color: var(--dark-green);
    }
    .nav-links a,
    .nav-back {
      color: var(--dark-green);
      text-decoration: none;
      transition: color .2s, text-shadow .2s;
    }
    .nav-links a:hover,
    .nav-back:hover {
      color: var(--green);
      text-decoration: none;
      opacity: 1;
      text-shadow: 0 0 12px rgba(0,255,65,0.35);
    }
    @media (max-width: 600px) {
      .nav-links { gap: 1rem; font-size: .6rem; justify-content: center; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-top">
        <a href="index.html" class="nav-logo">PUSHINN</a>
        <a href="index.html" class="nav-back">← BACK_TO_HOME</a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html#features">EXPLORE_MAP</a></li>
        <li><a href="terminal.html">THE_TERMINAL</a></li>
        <li><a href="business.html">BUSINESS</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="beta-onboarding.html">BETA</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <div class="success-icon">✓</div>
    <h1>Transmission Successful</h1>
    <p>INTEL_UPLOAD_COMPLETE // THE_CORE_HAS_RECEIVED_YOUR_DATA</p>
    <a href="index.html" class="btn-return">← RETURN_TO_HQ</a>
  </main>
  <footer>
    <span>&copy; <span class="yr"></span> PUSHINN. ALL_SYSTEMS_OPERATIONAL.</span>
    <div class="footer-links">
      <a href="index.html">HOME</a>
      <a href="terminal.html">THE_TERMINAL</a>
      <a href="business.html">BUSINESS</a>
      <a href="contact.html">CONTACT</a>
      <a href="beta-onboarding.html">BETA</a>
      <a href="legal-privacy.html">PRIVACY</a>
      <a href="legal-terms.html">TERMS</a>
    </div>
  </footer>
<script>document.querySelectorAll(".yr").forEach(function(el){el.textContent=new Date().getFullYear();});</script>
</body>
</html>
